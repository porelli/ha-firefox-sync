[project]
name = "ha-firefox-sync"
version = "0.1.0"
description = "Home Assistant integration for the firefox-sync admin UI and the health of a Firefox Sync stack"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL", "RUF", "ASYNC", "BLE", "PT"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.firefox_sync", "homeassistant"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# a test tool for the VM, not the integration
"scripts/*" = ["E501", "SIM115"]
