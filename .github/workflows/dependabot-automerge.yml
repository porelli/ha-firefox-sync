name: Dependabot auto-merge

# Dependabot's pull requests (.github/dependabot.yml) are squash-merged by GitHub's auto-merge once
# the checks the ruleset of main requires (validate.yml: HACS, Tests and lint, hassfest) pass, majors
# included. Only Dependabot's own pull requests: the job's if and the author check below.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Auto-merge once the required checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "${PR}"
